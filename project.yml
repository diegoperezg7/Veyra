name: Veyra
options:
  bundleIdPrefix: local.pulselab
  deploymentTarget:
    iOS: '26.0'
    watchOS: '26.0'
  developmentLanguage: es
  knownRegions: [es, en]
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
packages:
  PulseCore:
    path: PulseCore
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    TARGETED_DEVICE_FAMILY: 1
targets:
  Veyra:
    type: application
    platform: iOS
    sources:
      - App
      - Features
      - Health
      - Persistence
      - Services
      - Shared
      - path: Resources
        excludes: [ExerciseArt]
      # A folder reference: 540 illustrations as individual build entries would
      # bloat the project file for no benefit, and the app looks them up by name.
      - path: Resources/ExerciseArt
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.pulselab
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Veyra
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        NSHealthShareUsageDescription: Veyra utiliza tus datos de Salud para calcular sueño, recuperación, actividad y tendencias personales.
        NSHealthUpdateUsageDescription: Veyra guarda en Salud los entrenamientos que eliges registrar.
        NSMotionUsageDescription: Veyra utiliza el movimiento durante sesiones compatibles.
        NSBluetoothAlwaysUsageDescription: Veyra se conecta al sensor de frecuencia cardíaca que selecciones durante tus entrenamientos.
        NSSupportsLiveActivities: true
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [local.pulselab.refresh]
        PulseAppGroup: group.local.pulselab
        CFBundleURLTypes:
          - CFBundleURLName: local.pulselab
            CFBundleURLSchemes: [pulselab]
    dependencies:
      - package: PulseCore
      - target: VeyraWatch
        embed: true
      - target: VeyraWidgets
        embed: true
  VeyraWatch:
    type: application
    platform: watchOS
    sources:
      - Watch
      - path: Shared
        excludes: [StrengthActivity.swift]
      - path: Resources
        excludes: [exercises.json, Assets.xcassets, ExerciseArt]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.pulselab.watch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: 4
        CODE_SIGN_ENTITLEMENTS: Watch/Watch.entitlements
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Veyra
        WKApplication: true
        WKCompanionAppBundleIdentifier: local.pulselab
        WKBackgroundModes: [workout-processing, smart-alarm]
        NSHealthShareUsageDescription: Veyra lee la frecuencia cardíaca y actividad para mostrar tu entrenamiento.
        NSHealthUpdateUsageDescription: Veyra guarda tus entrenamientos en Salud.
        NSMotionUsageDescription: Veyra utiliza el movimiento en la ventana de alarma inteligente.
        PulseAppGroup: group.local.pulselab.watch
    dependencies:
      - package: PulseCore
      - target: VeyraWatchWidgets
        embed: true
  VeyraWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared/SharedSnapshot.swift
      - Shared/Localization.swift
      - Shared/StrengthActivity.swift
      - path: Resources
        excludes: [exercises.json, Assets.xcassets, ExerciseArt]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Veyra Widgets
        PulseAppGroup: group.local.pulselab
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.pulselab.widgets
        CODE_SIGN_ENTITLEMENTS: Widgets/Widgets.entitlements
    dependencies:
      - package: PulseCore
  VeyraWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - Widgets/PulseWidgets.swift
      - Shared/SharedSnapshot.swift
      - Shared/Localization.swift
      - path: Resources
        excludes: [exercises.json, Assets.xcassets, ExerciseArt]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.pulselab.watch.widgets
        CODE_SIGN_ENTITLEMENTS: WatchWidgets/WatchWidgets.entitlements
        TARGETED_DEVICE_FAMILY: 4
    info:
      path: WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Veyra Widgets
        PulseAppGroup: group.local.pulselab.watch
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    dependencies:
      - package: PulseCore
  VeyraTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/Unit]
    dependencies:
      - target: Veyra
      - package: PulseCore
  VeyraUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/UI]
    dependencies:
      - target: Veyra
schemes:
  Veyra:
    build:
      targets:
        Veyra: all
    test:
      targets: [VeyraTests, VeyraUITests]
  VeyraWatch:
    build:
      targets:
        VeyraWatch: all
